<div class="filter-dropdown" [class.filter-dropdown--open]="abierto">
  <span class="filter-dropdown__label">{{ label }}</span>
  <button
    type="button"
    class="filter-dropdown__trigger"
    (click)="toggle()"
    [attr.aria-expanded]="abierto"
  >
    <span>{{ textoSeleccionado }}</span
    ><span class="material-icons" aria-hidden="true">expand_more</span>
  </button>

  @if (abierto) {
    <button
      type="button"
      class="filter-dropdown__overlay"
      aria-label="Cerrar filtro"
      (click)="cerrar()"
    ></button>
    <section class="filter-dropdown__panel" data-scroll-lock-exempt>
      @for (option of options; track option.value) {
        <button type="button" class="filter-dropdown__option" (click)="seleccionar(option.value)">
          <span
            class="filter-dropdown__checkbox"
            [class.filter-dropdown__checkbox--checked]="selected.includes(option.value)"
          >
            @if (selected.includes(option.value)) {
              <span class="material-icons" aria-hidden="true">check</span>
            }
          </span>
          <span>{{ option.label }}</span>
        </button>
      }
      <button type="button" class="filter-dropdown__clear" (click)="limpiar()">
        Limpiar filtro
      </button>
    </section>
  }
</div>
