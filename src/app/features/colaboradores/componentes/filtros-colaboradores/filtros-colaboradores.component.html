<div style="display: contents" [formGroup]="form" (click)="cerrarDropdowns()">

    <!-- Búsqueda -->
    <div class="filter-group">
      <label class="filter-label">Búsqueda</label>
      <div class="filter-input-wrapper">
        <span class="material-symbols-outlined filter-icon">search</span>
        <input type="text" class="filter-input" placeholder="Buscar por nombres, identificación..." formControlName="busqueda" autocomplete="off" />
        @if (form.get('busqueda')?.value) {
           <button type="button" class="filter-clear" (click)="form.get('busqueda')?.setValue('')" aria-label="Limpiar filtro" title="Limpiar filtro"><span class="material-icons">close</span></button>
        }
      </div>
    </div>

    <!-- Estado dropdown -->
    <div class="filter-group filter-group--desplegable" (click)="toggleEstado($event)">
      <label class="filter-label">Estado</label>
      <div class="filter-input-wrapper">
         <div class="filter-input filter-trigger">
            <span class="filter-trigger-texto">{{ estadoSeleccionado }}</span>
            <span class="material-symbols-outlined select-chevron">expand_more</span>
         </div>
      </div>

      @if (estadoAbierto) {
        <div class="dropdown-estado" (click)="$event.stopPropagation()">
            @for (opcion of opcionesEstado; track opcion.valor) {
              @if (opcion.valor !== 'Todos') {
                <div class="dropdown-opcion" (click)="seleccionarEstado(opcion.valor, $event)">
                  <div class="dropdown-checkbox" [class.checked]="estadoSeleccionado === opcion.valor">
                    @if (estadoSeleccionado === opcion.valor) {
                      <span class="material-icons">check</span>
                    }
                  </div>
                  <span class="opcion-label">{{ opcion.label }}</span>
                </div>
              }
            }
          <div class="dropdown-limpiar" (click)="limpiarFiltroEstado($event)">Limpiar filtro</div>
        </div>
      }
    </div>

</div>
