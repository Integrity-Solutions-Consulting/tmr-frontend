<!-- sm - Header del modal: nombre del colaborador + botón cerrar (solo cierra el overlay, no navega). -->
<div class="calcol-modal">
    <div class="calcol-modal__header">
        <div class="calcol-modal__header-text">
            <h2 class="calcol-modal__title">Calendario de {{ data.colaborador.nombre }}</h2>
            <!-- sm - Cada fila de Seguimiento es un colaborador+proyecto puntual: se aclara a qué proyecto
                 corresponde el cumplimiento que se ve abajo (igual regla que esa fila: jornada completa en ESE proyecto). -->
            <p class="calcol-modal__subtitle" *ngIf="idProyecto; else sinProyectoSubtitulo">
                {{ completando() ? 'Completando actividades: haz clic en un día para agregar' : 'Solo lectura' }} · Proyecto: {{ data.colaborador.proyecto }}
            </p>
            <ng-template #sinProyectoSubtitulo>
                <p class="calcol-modal__subtitle">Solo lectura</p>
            </ng-template>
        </div>
        <div class="calcol-modal__actions">
            <button *ngIf="completar()" class="calcol-modal__completar" type="button"
                [class.calcol-modal__completar--activo]="completando()" (click)="alternarCompletar()">
                <mat-icon aria-hidden="true">{{ completando() ? 'check' : 'edit_calendar' }}</mat-icon>
                {{ completando() ? 'Terminar' : 'Completar actividades' }}
            </button>
            <button class="calcol-modal__close" type="button" (click)="cerrar()" aria-label="Cerrar">
                <img src="assets/iconos/x.svg" alt="Cerrar" />
            </button>
        </div>
    </div>

    <!-- sm - idEmpleadoOverride: carga las actividades de este colaborador (no las del usuario logueado). -->
    <!-- sm - idProyectoOverride: limita el resumen de cumplimiento (horas por registrar/promedio) al proyecto de
         esta fila, no al total de todos los proyectos del colaborador (ver Calendario.idProyectoOverride). -->
    <!-- sm - soloLectura: bloquea agregar/editar actividades; la navegación entre meses sigue disponible. -->
    <!-- sm - idLiderEdicion: al completar, el líder solo abre las actividades que él mismo cargó. -->
    <div class="calcol-modal__body">
        <app-calendario [idEmpleadoOverride]="idEmpleado" [idProyectoOverride]="idProyecto" [soloLectura]="!completando()"
            [idLiderEdicion]="completando() ? completar()?.idLider : null" [fechaInicialOverride]="data.fechaDesde"
            (diaSeleccionado)="abrirAgregar($event)" (editarActividadEvent)="abrirEditar($event)"></app-calendario>
    </div>
</div>
