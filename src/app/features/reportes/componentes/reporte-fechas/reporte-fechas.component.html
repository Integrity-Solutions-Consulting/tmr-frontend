<div class="report-wrapper">

  <app-header title="Reporte Por Fechas" subtitle="Consulta detallada de asignaciones y periodos de ejecución.">
    <app-descargar-menu 
      [disabled]="datosFiltrados().length === 0"
      (descargarPDF)="exportarPDF()" 
      (descargarExcel)="exportarExcel()">
    </app-descargar-menu>
  </app-header>

  @if (mostrarDatos() && datosFiltrados().length > 0) {
    <!-- sm - Tarjetas de resumen con el diseño único del sistema (app-tarjeta-resumen, mismo del Dashboard). -->
    <div class="tarjetas-resumen">
      <app-tarjeta-resumen titulo="Asignaciones" icono="assignment" tono="destacado" [valor]="datosFiltrados().length" />
      <app-tarjeta-resumen titulo="Líderes" icono="supervisor_account" tono="corporativo" [valor]="lideresUnicos()" />
      <app-tarjeta-resumen titulo="Recursos" icono="groups" tono="corporativo" [valor]="recursosUnicos()" />
      <app-tarjeta-resumen titulo="Clientes" icono="business" tono="cian" [valor]="clientesUnicos()" />
    </div>
  }

  <div class="filters-card">
    <div class="filter-group">
      <label class="filter-label">Cliente</label>
      <div class="filter-input-wrapper">
        <span class="material-symbols-outlined filter-icon">search</span>
        <input type="text" [value]="busquedaCliente()" (input)="onInputSanitized('cliente', $event)"
          placeholder="Buscar cliente..." class="filter-input">
        @if (busquedaCliente()) {
          <button type="button" class="filter-clear" (click)="limpiarBusqueda('cliente')" aria-label="Limpiar filtro" title="Limpiar filtro"><span class="material-icons">close</span></button>
        }
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">Líder</label>
      <div class="filter-input-wrapper">
        <span class="material-symbols-outlined filter-icon">search</span>
        <input type="text" [value]="busquedaLider()" (input)="onInputSanitized('lider', $event)"
          placeholder="Buscar líder..." class="filter-input">
        @if (busquedaLider()) {
          <button type="button" class="filter-clear" (click)="limpiarBusqueda('lider')" aria-label="Limpiar filtro" title="Limpiar filtro"><span class="material-icons">close</span></button>
        }
      </div>
    </div>

    <div class="filter-group date-group">
      <label class="filter-label">Fecha desde</label>
      <input type="date" [ngModel]="fechaInicio()" (ngModelChange)="onFiltroChange('fechaInicio', $event)"
        [max]="fechaMaxima" class="filter-input">
    </div>

    <div class="filter-group date-group">
      <label class="filter-label">Fecha hasta</label>
      <input type="date" [ngModel]="fechaFin()" (ngModelChange)="onFiltroChange('fechaFin', $event)"
        [min]="fechaInicio()" [max]="fechaMaxima" class="filter-input">
    </div>
  </div>

  @if (!mostrarDatos()) {
    <div class="empty-state">
      <div class="empty-content">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </div>
        <h3>Consulta de Reporte por Fechas</h3>
        <p>Filtra por cliente, líder o rango para visualizar resultados.</p>
        <button (click)="verTodo()" class="btn-link">Ver todo el historial</button>
      </div>
    </div>
  } @else {
    <app-tabla [datosPaginados]="datosPaginados()" [columnas]="columnasTabla" [paginaActual]="paginaActual"
      [totalPaginas]="totalPaginas" [total]="totalItems()" [porPagina]="itemsPorPagina()"
      [mostrarDatos]="mostrarDatos()" (paginaCambia)="paginaActual.set($event)">
    </app-tabla>
  }

</div>
