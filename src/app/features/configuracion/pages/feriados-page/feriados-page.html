<section class="page">
  <div class="page-header">
    <h1 class="page-title">Días Festivos</h1>
  </div>

  <!-- sm - Tarjetas con el estilo estándar del sistema (el mismo de Usuarios, Roles, Catálogos y Líderes). Solo el ícono
       de cada tipo lleva su color, el mismo que usa el calendario: Nacional verde, Local azul, Religioso naranja. -->
  <!-- sm - Tarjetas de resumen con el diseño único del sistema (app-tarjeta-resumen, mismo del Dashboard). -->
  <div class="tarjetas-resumen">
    <app-tarjeta-resumen titulo="Total feriados" icono="calendar_month" tono="destacado" [valor]="feriados().length" />
    <app-tarjeta-resumen titulo="Activos" icono="check_circle" tono="corporativo" [valor]="activos()" />
    <app-tarjeta-resumen titulo="Nacionales" icono="public" tono="exito" [valor]="nacionales()" />
    <app-tarjeta-resumen titulo="Locales" icono="location_on" tono="cian" [valor]="locales()" />
    <app-tarjeta-resumen titulo="Religiosos" icono="celebration" tono="advertencia" [valor]="religiosos()" />
  </div>

  <!-- sm - Acciones a la derecha, con los botones estándar del sistema (btn-descargar / btn-agregar, como Usuarios). -->
  <div class="acciones">
    <!-- sm - Importar feriados de Ecuador del año indicado; luego se revisan/corrigen a mano los traslados por decreto. -->
    <input type="number" class="importar-anio" min="2000" max="2100" aria-label="Año a importar"
      title="Año a importar" [value]="anioImportar()" (change)="cambiarAnioImportar($any($event.target).value)" />
    <button type="button" class="btn-descargar enabled" [class.loading]="importando()" [disabled]="importando()"
      (click)="importarFeriados()" title="Carga los feriados nacionales de Ecuador del año. No duplica los ya registrados.">
      {{ importando() ? 'Importando…' : 'Importar' }}
      <span class="material-icons download-icon" [class.girando]="importando()">{{ importando() ? 'sync' : 'cloud_download' }}</span>
    </button>
    <button type="button" class="btn-descargar btn-agregar" (click)="openModal()">
      Agregar
      <span class="material-icons download-icon">add</span>
    </button>
  </div>

  @if (eliminarError()) {
    <div class="error-banner">
      {{ eliminarError() }}
    </div>
  }

  <app-feriados-calendar
    [feriados]="feriados()"
    (addFeriado)="openModalForDate($event)"
    (viewFeriado)="viewFeriado($event)"
    (editFeriado)="editFeriado($event)"
    (deleteFeriado)="toggleEstado($event)"
  />
</section>

<app-confirm-dialog
  [visible]="confirmVisible()"
  titulo="Eliminar feriado"
  [mensaje]="confirmMensaje()"
  textoConfirmar="Eliminar"
  textoCancelar="Cancelar"
  (confirmar)="onConfirmarEliminar()"
  (cancelar)="onCancelarEliminar()"
/>

<app-success-modal
  [visible]="exitoVisible()"
  [mensaje]="exitoMensaje()"
  (cerrar)="cerrarExito()"
/>
